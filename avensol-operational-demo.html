<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entegre kontrol paneli</title>
<style>
:root{
  --ground:#EFF2F2; --panel:#FFFFFF; --panel-2:#F7F9F9; --ink:#141F1E; --muted:#59675F; --rule:#D3DCDA; --accent:#0E727C; --accent-soft:#D9EDEF;
  --red:#AF3826; --red-bg:#F8DED8; --amber:#8C5F0E; --amber-bg:#F8EBCE; --green:#256B41; --green-bg:#DCF0E2;
  --shadow:0 1px 2px rgba(20,31,30,.07);
  --yantar:#9A6212; --yantar-fon:#FBF0DC;
  --indigo:#33509B; --indigo-fon:#E4E9F7;
  --biryuza:#0E727C; --biryuza-fon:#DCEEF0;
  --sliva:#7A3E86; --sliva-fon:#F2E6F4;
  --hvoya:#256B41; --hvoya-fon:#DFF0E6;
  --terrakot:#A94D33; --terrakot-fon:#FBE6E0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1615; --panel:#16201F; --panel-2:#1B2625; --ink:#E5ECEA; --muted:#93A29C;
  --rule:#2A3A37; --accent:#57BDC6; --accent-soft:#17383B;
  --red:#EE8B78; --red-bg:#3B201B; --amber:#E0B264; --amber-bg:#372C15; --green:#77C894; --green-bg:#1A3123;
  --shadow:none;
  --yantar:#E2B263; --yantar-fon:#33280F;
  --indigo:#8AA4E8; --indigo-fon:#1B2340;
  --biryuza:#57BDC6; --biryuza-fon:#123338;
  --sliva:#C994D4; --sliva-fon:#2C1A31;
  --hvoya:#7CCB98; --hvoya-fon:#14301F;
  --terrakot:#EFA189; --terrakot-fon:#37201A;
}}
:root[data-theme="dark"]{
  --ground:#0E1615; --panel:#16201F; --panel-2:#1B2625; --ink:#E5ECEA; --muted:#93A29C;
  --rule:#2A3A37; --accent:#57BDC6; --accent-soft:#17383B;
  --red:#EE8B78; --red-bg:#3B201B; --amber:#E0B264; --amber-bg:#372C15; --green:#77C894; --green-bg:#1A3123;
  --shadow:none;
  --yantar:#E2B263; --yantar-fon:#33280F;
  --indigo:#8AA4E8; --indigo-fon:#1B2340;
  --biryuza:#57BDC6; --biryuza-fon:#123338;
  --sliva:#C994D4; --sliva-fon:#2C1A31;
  --hvoya:#7CCB98; --hvoya-fon:#14301F;
  --terrakot:#EFA189; --terrakot-fon:#37201A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);
  font:15px/1.5 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  padding-block:0 48px}
.obolochka{max-width:1180px;margin:0 auto;padding-inline:18px}
h1{font-size:21px;font-weight:650;margin:0;letter-spacing:-.01em}
h2{font-size:16px;font-weight:650;margin:0}
h3{font-size:14px;font-weight:650;margin:0}
p{margin:0}
.tihiy{color:var(--muted)}
.melko{font-size:13px}

header{background:var(--panel);border-bottom:1px solid var(--rule);
  padding-top:env(safe-area-inset-top,0px);position:sticky;top:0;z-index:5}
.shapka{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:14px}
.shapka-levo{display:grid;gap:3px}
.shapka-pravo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.plashka{display:inline-flex;align-items:center;gap:7px;background:var(--amber-bg);color:var(--amber);
  border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
.plashka::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.yazyki{display:flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.yazyki button{border:0;background:var(--panel);color:var(--muted);font:600 13px/1 inherit;
  padding:8px 13px;cursor:pointer}
.yazyki button[aria-pressed="true"]{background:var(--accent);color:#fff}

nav{display:flex;gap:2px;overflow-x:auto;border-top:1px solid var(--rule);scrollbar-width:thin}
nav button{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);
  font:600 13.5px/1 inherit;padding:13px 14px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav button:hover{color:var(--ink)}

main{padding-top:22px;display:grid;gap:20px}
section{display:grid;gap:14px}
.zagolovok-ekrana{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}

.karty{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}
.karta{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:15px;
  display:grid;gap:10px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.karta::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--rule)}
.karta.krasny::before{background:var(--red)}
.karta.zheltyy::before{background:var(--amber)}
.karta.zelenyy::before{background:var(--green)}
.karta-verh{display:flex;justify-content:space-between;gap:10px;align-items:start}
.karta-imya{font-weight:650}
.tochka{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
.tochka.krasny{background:var(--red)} .tochka.zheltyy{background:var(--amber)} .tochka.zelenyy{background:var(--green)}
.pary{display:grid;gap:5px}
.para{display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
.para span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.polosa{height:6px;border-radius:3px;background:var(--panel-2);border:1px solid var(--rule);overflow:hidden}
.polosa i{display:block;height:100%;background:var(--accent)}

.tabl{background:var(--panel);border:1px solid var(--rule);border-radius:10px;overflow-x:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
th{font-size:11.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
  background:var(--panel-2);white-space:nowrap}
td.ch,th.ch{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.kod{white-space:nowrap}
tr.klikabelnaya{cursor:pointer}
tr.klikabelnaya:hover{background:var(--panel-2)}
tr.podsvechena>td{background:var(--accent-soft)}
.znachok{display:inline-block;font-size:11.5px;font-weight:650;padding:3px 7px;border-radius:4px;white-space:nowrap}
.znachok.krasny{background:var(--red-bg);color:var(--red)}
.znachok.zheltyy{background:var(--amber-bg);color:var(--amber)}
.znachok.zelenyy{background:var(--green-bg);color:var(--green)}
.znachok.seryy{background:var(--panel-2);color:var(--muted);border:1px solid var(--rule)}
.krasnoe{color:var(--red);font-weight:650}
.zelenoe{color:var(--green);font-weight:650}
.zheltoe{color:var(--amber);font-weight:650}
.knopka{border:1px solid var(--rule);background:var(--panel);color:var(--accent);font:600 12.5px/1 inherit;
  padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.knopka:hover{background:var(--accent-soft)}
.knopki{display:flex;gap:7px;flex-wrap:wrap}
.knopki .knopka[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.raskrytie{background:var(--panel-2)}
.raskrytie td{padding:0}
.vnutri{padding:12px 13px;display:grid;gap:9px}
.vnutri table{background:var(--panel);border:1px solid var(--rule);border-radius:8px;overflow:hidden}

.dvoyka{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;align-items:start}
.blok{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:15px;display:grid;gap:10px;box-shadow:var(--shadow)}
.spisok{display:grid;gap:7px;margin:0;padding:0;list-style:none;font-size:13.5px}
.spisok li{display:flex;gap:9px}
.spisok li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;margin-top:7px}
.spisok.riski li::before{background:var(--red)}
.spisok.nehvatka li::before{background:var(--amber)}

.lenta{display:grid;gap:8px}
.zakaz{display:grid;gap:8px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:13px 15px;box-shadow:var(--shadow)}
.zakaz-verh{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;align-items:baseline}
.shkala{position:relative;height:26px;background:var(--panel-2);border:1px solid var(--rule);border-radius:6px}
.shkala i{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-right:2px solid var(--accent)}
.metka{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--ink)}
.metka.krasny{background:var(--red)} .metka.zheltyy{background:var(--amber)}
.shkala-podpisi{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

.zvenya{display:flex;flex-wrap:wrap;gap:6px 10px;border-top:1px dashed var(--rule);padding-top:9px;font-size:12.5px}
.zveno{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.zveno b{color:var(--ink);font-weight:650}
.zveno+.zveno::before{content:"→";margin-right:4px;color:var(--rule)}
.krupno{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums}
.stolbiki{display:grid;gap:3px;min-width:120px}
.stolbiki i{display:block;height:7px;border-radius:2px}
.stolbiki .prihod{background:var(--green)}
.stolbiki .rashod{background:var(--red)}
/* плитки подразделений */
.plitki{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.plitka{background:var(--panel);border:1px solid var(--rule);border-radius:12px;overflow:hidden;
  display:grid;grid-template-rows:auto 1fr;box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease}
.plitka:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,31,30,.10)}
.plitka header{display:flex;align-items:center;gap:10px;padding:13px 16px;color:#fff}
.plitka header h3{font-size:15px;font-weight:650;color:inherit}

.plitka-telo{padding:15px 16px;display:flex;flex-direction:column;gap:11px}
.plitka-telo .knopki{margin-top:auto;padding-top:3px}
.plitka .krupno{font-size:27px;line-height:1.05}
.plitka.yantar header{background:var(--yantar)} .plitka.yantar .krupno{color:var(--yantar)}
.plitka.indigo header{background:var(--indigo)} .plitka.indigo .krupno{color:var(--indigo)}
.plitka.biryuza header{background:var(--biryuza)} .plitka.biryuza .krupno{color:var(--biryuza)}
.plitka.sliva header{background:var(--sliva)} .plitka.sliva .krupno{color:var(--sliva)}
.plitka.hvoya header{background:var(--hvoya)} .plitka.hvoya .krupno{color:var(--hvoya)}
.plitka.terrakot header{background:var(--terrakot)} .plitka.terrakot .krupno{color:var(--terrakot)}
.plitka .pary{border-top:1px solid var(--rule);padding-top:9px}

/* карточки материалов */
.materialy{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.material{display:grid;gap:5px;align-content:start;text-align:left;text-decoration:none;cursor:pointer;
  background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:15px 16px;color:inherit;
  font:inherit;transition:border-color .15s ease,transform .15s ease}
.material:hover{border-color:var(--accent);transform:translateY(-2px)}
.material-znak{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;
  border-radius:9px;background:var(--accent-soft);color:var(--accent);font:650 13px/1 var(--mono,inherit);
  font-variant-numeric:tabular-nums;margin-bottom:4px}
.material-imya{font-weight:650}

/* презентация */
.tochki{display:flex;gap:6px;flex-wrap:wrap}
.tochka{width:26px;height:5px;border:0;border-radius:3px;background:var(--rule);cursor:pointer;padding:0}
.tochka.tekushchaya{background:var(--accent)}
.slaydy{display:grid;gap:18px}
.slayd{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:26px 28px;
  display:grid;gap:18px;align-content:start;min-height:360px;box-shadow:var(--shadow)}
.slayd-shapka{display:flex;align-items:baseline;gap:14px;justify-content:space-between;
  border-bottom:1px solid var(--rule);padding-bottom:12px}
.slayd-shapka h3{font-size:20px;font-weight:650;flex:1}
.slayd-schet{font:650 13px/1 inherit;color:var(--muted);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.slayd-oblozhka{display:grid;gap:14px;align-content:center;min-height:300px;
  background:linear-gradient(135deg,var(--accent-soft),transparent 65%);border-radius:10px;padding:26px}
.slayd-titul{font-size:clamp(24px,3.6vw,38px);font-weight:700;line-height:1.1;letter-spacing:-.015em}
.slayd-lid{font-size:17px;color:var(--muted);max-width:52ch}
.slayd-setka{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}
.slayd-karta{background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;padding:15px;display:grid;gap:6px;align-content:start}
.slayd-karta h4,.slayd-sloy h4,.slayd-zveno h4,.slayd-etap h4{font-size:15px;font-weight:650;margin:0}
.slayd-nomer{font:650 12px/1 inherit;color:var(--accent);font-variant-numeric:tabular-nums}
.slayd-sloi{display:grid;gap:9px}
.slayd-sloy{display:flex;gap:14px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--rule);
  border-radius:10px;padding:14px 16px}
.sloy-nomer{display:flex;align-items:center;justify-content:center;width:30px;height:30px;flex:none;
  border-radius:8px;background:var(--accent);color:#fff;font-weight:650}
.slayd-cepochka{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.slayd-zveno{background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;padding:13px;display:grid;gap:5px;
  border-top:3px solid var(--accent)}
.zveno-nomer{font:650 11px/1 inherit;color:var(--muted)}
.slayd-razlozhenie{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.storona{background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;padding:18px;display:grid;gap:8px}
.storona.levo{align-content:center;text-align:center}
.storona.levo .poz{font-size:19px;font-weight:700;letter-spacing:.01em}
.strelka{font-size:22px;color:var(--muted)}
.resurs-stroka{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--rule);padding-bottom:5px;font-size:14px}
.resurs-stroka:last-child{border-bottom:0;padding-bottom:0}
.slayd-zony{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px}
.slayd-zona{background:var(--panel-2);border:1px solid var(--rule);border-radius:9px;padding:13px;display:grid;gap:5px;font-weight:600}
.zona-nomer{font:650 11px/1 inherit;color:var(--accent)}
.slayd-etapy{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.slayd-etap{background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;padding:15px;display:grid;gap:6px;
  border-left:3px solid var(--accent)}
.slayd-resheniya{display:grid;gap:8px}
.slayd-reshenie{display:flex;gap:12px;align-items:baseline;background:var(--panel-2);border:1px solid var(--rule);
  border-radius:9px;padding:12px 15px;font-size:15px}
.slayd-snoska{font-size:13.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px;max-width:80ch}

@media print{
  header,nav,.zagolovok-ekrana,.tochki,footer{display:none!important}
  body{background:#fff;padding:0}
  .slayd{break-after:page;border:0;box-shadow:none;min-height:auto;padding:0 0 24px}
  .slayd[hidden]{display:grid!important}
}

.vopros{display:grid;gap:9px}
.otvet{background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;padding:13px 15px;display:grid;gap:9px}
.snoska{font-size:13px;color:var(--muted);max-width:70ch}
footer{margin-top:26px;border-top:1px solid var(--rule);padding-top:14px;font-size:12.5px;color:var(--muted)}
@media (max-width:620px){
  .para{font-size:13px}
  th,td{padding:8px 10px}
}
body.auth-lock{overflow:hidden}
body.auth-lock header,body.auth-lock main{display:none}
.auth-gate{position:fixed;inset:0;z-index:9999;display:none;place-items:center;padding:24px;color:#F5FAF9;background:linear-gradient(135deg,rgba(18,57,71,.96),rgba(23,32,38,.97))}
body.auth-lock .auth-gate{display:grid}
.auth-card{width:min(440px,100%);padding:26px;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:rgba(255,255,255,.08);box-shadow:0 22px 60px rgba(0,0,0,.28)}
.auth-mark{width:42px;height:42px;display:grid;place-items:center;margin-bottom:16px;border:1px solid rgba(255,255,255,.28);border-radius:8px;background:linear-gradient(135deg,#D8912B,#2F765F);font-weight:800}
.auth-card h2{margin:0 0 8px;font-size:28px;line-height:1.05;text-transform:uppercase}
.auth-card p{margin:0 0 18px;color:rgba(245,250,249,.72);font-size:14px;line-height:1.45}
.auth-form{display:grid;gap:10px}
.auth-form label{color:rgba(245,250,249,.72);font-size:11px;text-transform:uppercase}
.auth-form input{width:100%;padding:13px 14px;border:1px solid rgba(255,255,255,.18);border-radius:8px;color:#fff;background:rgba(0,0,0,.18);outline:none}
.auth-form input:focus{border-color:rgba(216,145,43,.95);box-shadow:0 0 0 3px rgba(216,145,43,.16)}
.auth-form button{padding:13px 14px;border:0;border-radius:8px;color:#fff;background:#0E727C;font-weight:700;cursor:pointer}
.auth-error{min-height:18px;color:#ffb6a8;font-size:12px}
</style>
</head>
<body class="auth-lock">

<section class="auth-gate" aria-labelledby="authTitle">
  <div class="auth-card">
    <div class="auth-mark">AV</div>
    <h2 id="authTitle">Operational Demo</h2>
    <p>Закрытый операционный прототип AVENSOL на сценарных, не фактических данных компании. Введите пароль доступа для просмотра.</p>
    <form class="auth-form" id="authForm">
      <label for="authPassword">Пароль</label>
      <input id="authPassword" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Открыть демо</button>
      <div class="auth-error" id="authError" role="alert"></div>
    </form>
  </div>
</section>

<header>
  <div class="obolochka">
    <div class="shapka">
      <div class="shapka-levo">
        <h1 id="zagolovok">Entegre kontrol paneli</h1>
        <p class="tihiy melko" id="podzagolovok">Dört şantiye, tek veri zinciri</p>
      </div>
      <div class="shapka-pravo">
        <span class="plashka" id="plashka">Örnek veriler</span>
        <div class="yazyki" role="group" aria-label="Dil / Язык">
          <button id="yaz-tr" type="button" aria-pressed="true">TR</button>
          <button id="yaz-ru" type="button" aria-pressed="false">RU</button>
        </div>
      </div>
    </div>
    <nav id="vkladki" role="tablist"></nav>
  </div>
</header>

<main class="obolochka">
  <section id="ekran-otdely" role="tabpanel"></section>
  <section id="ekran-svodka" role="tabpanel" hidden></section>
  <section id="ekran-sklad" role="tabpanel" hidden></section>
  <section id="ekran-akt" role="tabpanel" hidden></section>
  <section id="ekran-zakupki" role="tabpanel" hidden></section>
  <section id="ekran-dengi" role="tabpanel" hidden></section>
  <section id="ekran-tender" role="tabpanel" hidden></section>
  <section id="ekran-personal" role="tabpanel" hidden></section>
  <section id="ekran-ii" role="tabpanel" hidden></section>
  <section id="ekran-sunum" role="tabpanel" hidden></section>
  <footer id="podval"></footer>
</main>

<script>
const AUTH_HASH = "c854e5673d58a9c30acd0cf8e2d480637993e483b17df88cbd92e405036d0904";
const AUTH_KEY = "avensol-control-room-unlocked";
const authForm = document.getElementById("authForm");
const authPassword = document.getElementById("authPassword");
const authError = document.getElementById("authError");

async function sha256(value) {
  const buffer = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(value));
  return [...new Uint8Array(buffer)].map(byte => byte.toString(16).padStart(2, "0")).join("");
}

function unlockDemo() {
  document.body.classList.remove("auth-lock");
  sessionStorage.setItem(AUTH_KEY, "1");
}

if (sessionStorage.getItem(AUTH_KEY) === "1") {
  unlockDemo();
}

setInterval(() => {
  if (document.body.classList.contains("auth-lock") && sessionStorage.getItem(AUTH_KEY) === "1") {
    unlockDemo();
  }
}, 300);

authForm.addEventListener("submit", async event => {
  event.preventDefault();
  authError.textContent = "";
  try {
    if (await sha256(authPassword.value.trim()) === AUTH_HASH) {
      unlockDemo();
      return;
    }
    authError.textContent = "Пароль не подошёл. Проверьте регистр и дефисы.";
  } catch (error) {
    authError.textContent = "Браузер не смог проверить пароль. Откройте страницу по HTTPS.";
  }
});

let YAZYK = "tr";
let VKLADKA = "otdely";
let SLAYD = 0;
let SLAYDY_PODRYAD = false;
let SKLAD = "A";
let ZAKUPKI = "C";
let PODSVETKA = null;
const RASKRYTO = new Set(["A-FND-01"]);
let VOPROS = DANNYE.voprosy_ii[0].id;

const EKRANY = [
  {kod: "otdely", klyuch: "vkladka_otdely"},
  {kod: "svodka", klyuch: "vkladka_svodka"},
  {kod: "sklad", klyuch: "vkladka_sklad"},
  {kod: "akt", klyuch: "vkladka_akt"},
  {kod: "zakupki", klyuch: "vkladka_zakupki"},
  {kod: "dengi", klyuch: "vkladka_dengi"},
  {kod: "tender", klyuch: "vkladka_tender"},
  {kod: "personal", klyuch: "vkladka_personal"},
  {kod: "ii", klyuch: "vkladka_ii"},
  {kod: "sunum", klyuch: "vkladka_sunum"}
];

/* --- мелкие помощники --- */
const t = (k) => (SLOVAR[k] || {})[YAZYK] || k;
const nz = (o, osnova) => (osnova ? o[osnova + "_" + YAZYK] : o[YAZYK]);
const lokal = () => (YAZYK === "tr" ? "tr-TR" : "ru-RU");
const ekran = (kod) => document.getElementById("ekran-" + kod);

function chislo(x, znakov) {
  const z = znakov === undefined ? 0 : znakov;
  return new Intl.NumberFormat(lokal(), {minimumFractionDigits: z, maximumFractionDigits: z}).format(x);
}
function dengi(x, znakov) {
  return chislo(x, znakov) + " " + DANNYE.meta.valyuta;
}
function data(s) {
  if (!s) return "—";
  const [g, a, d] = s.split("-");
  return d + "." + a + "." + g;
}
function ekranirovat(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function tablica(zagolovki, stroki, klass) {
  const shapka = zagolovki.map(z => '<th' + (z.ch ? ' class="ch"' : '') + '>' + ekranirovat(z.tekst) + '</th>').join("");
  return '<div class="tabl"><table' + (klass ? ' class="' + klass + '"' : '') + '>' +
         '<thead><tr>' + shapka + '</tr></thead><tbody>' + stroki.join("") + '</tbody></table></div>';
}
function plashka_demo() {
  return '<span class="znachok seryy">' + ekranirovat(t("demo")) + '</span>';
}
function zagolovok_ekrana(tekst, sprava) {
  return '<div class="zagolovok-ekrana"><h2>' + ekranirovat(tekst) + '</h2>' +
         '<div class="knopki">' + (sprava || "") + plashka_demo() + '</div></div>';
}
function rabota_po_id(id) { return DANNYE.raboty.find(r => r.id === id); }
function zakaz_po_id(id) { return DANNYE.zakazy.find(z => z.id === id); }

/* --- переход по сигналу --- */
function pereyti(ssylka) {
  PODSVETKA = ssylka;
  const rabota = rabota_po_id(ssylka);
  if (rabota) {
    RASKRYTO.add(ssylka);
    VKLADKA = "akt";
  } else {
    const zakaz = zakaz_po_id(ssylka);
    if (zakaz) { ZAKUPKI = zakaz.ploshchadka; VKLADKA = "zakupki"; }
  }
  narisovat();
  const stroka = document.querySelector("tr.podsvechena, .zakaz.podsvechena");
  if (stroka && stroka.scrollIntoView) stroka.scrollIntoView({block: "center", behavior: "smooth"});
}

/* --- экран: подразделения --- */
function znachenie_vida(v, vid) {
  if (vid === "dengi") return dengi(v);
  if (vid === "data") return data(v);
  if (vid === "chasy") return chislo(v) + " " + (YAZYK === "tr" ? "saat" : "ч");
  return chislo(v);
}

function narisovat_otdely() {
  const plitki = DANNYE.podrazdeleniya.map(o => {
    const stroki = o.stroki.map(s =>
      '<div class="para"><span class="tihiy">' + ekranirovat(nz(s)) + '</span>' +
      '<span>' + ekranirovat(znachenie_vida(s.znachenie, s.vid)) + '</span></div>').join("");
    const knopki = o.knopki.map(k => {
      const argumenty = k.ssylka ? [k.ekran, k.ssylka] : [k.ekran];
      const vyzov = "otkryt(" + argumenty.map(x => JSON.stringify(x)).join(",") + ")";
      return '<button type="button" class="knopka" onclick=' + JSON.stringify(vyzov) + '>' +
        ekranirovat(nz(k)) + '</button>';
    }).join("");
    return '<article class="plitka ' + o.cvet + '">' +
      '<header>' +
      '<h3>' + ekranirovat(nz(o)) + '</h3></header>' +
      '<div class="plitka-telo">' +
      '<div class="krupno">' + ekranirovat(znachenie_vida(o.znachenie, o.vid)) + '</div>' +
      '<div class="tihiy melko">' + ekranirovat(nz(o, "podpis")) + '</div>' +
      '<div class="pary">' + stroki + '</div>' +
      '<div class="knopki">' + knopki + '</div>' +
      '</div></article>';
  }).join("");

  const materialy =
    '<div class="karty materialy">' +
    '<a class="material" href="https://avensol.az/" target="_blank" rel="noopener">' +
    '<span class="material-znak">AZ</span>' +
    '<span class="material-imya">' + ekranirovat(t("sayt_kompanii")) + '</span>' +
    '<span class="tihiy melko">' + ekranirovat(t("sayt_poyasnenie")) + '</span></a>' +
    '<button type="button" class="material" onclick=' + JSON.stringify('otkryt("sunum")') + '>' +
    '<span class="material-znak">11</span>' +
    '<span class="material-imya">' + ekranirovat(t("prezentaciya_kartochka")) + '</span>' +
    '<span class="tihiy melko">' + ekranirovat(t("prezentaciya_poyasnenie")) + '</span></button>' +
    '<button type="button" class="material" onclick="pechat_sunum()">' +
    '<span class="material-znak">PDF</span>' +
    '<span class="material-imya">' + ekranirovat(t("skachat_pdf")) + '</span>' +
    '<span class="tihiy melko">' + ekranirovat(t("pdf_poyasnenie")) + '</span></button>' +
    '</div>';

  ekran("otdely").innerHTML =
    zagolovok_ekrana(t("otdely_zagolovok")) +
    '<p class="snoska">' + ekranirovat(t("otdely_podzagolovok")) + '</p>' +
    '<div class="plitki">' + plitki + '</div>' +
    '<h3>' + ekranirovat(t("materialy")) + '</h3>' + materialy;
}

function otkryt(kod, ssylka) {
  if (ssylka) { pereyti(ssylka); return; }
  VKLADKA = kod; PODSVETKA = null; zapisat_adres(); narisovat();
  window.scrollTo({top: 0, behavior: "smooth"});
}

/* --- экран 1: сводка --- */
function narisovat_svodku() {
  const karty = DANNYE.ploshchadki.map(p => {
    return '<article class="karta ' + p.signal + '">' +
      '<div class="karta-verh"><div><div class="karta-imya">' + ekranirovat(nz(p, "kod")) + '</div>' +
      '<div class="tihiy melko">' + ekranirovat(nz(p, "tip")) + '</div></div>' +
      '<span class="tochka ' + p.signal + '" aria-hidden="true"></span></div>' +
      '<div class="polosa"><i style="width:' + p.vypolneno_pct + '%"></i></div>' +
      '<div class="pary">' +
      '<div class="para"><span class="tihiy">' + ekranirovat(t("vypolneno")) + '</span><span>' + p.vypolneno_pct + ' %</span></div>' +
      '<div class="para"><span class="tihiy">' + ekranirovat(t("byudzhet")) + '</span><span>' + dengi(p.byudzhet) + '</span></div>' +
      '<div class="para"><span class="tihiy">' + ekranirovat(t("fakt")) + '</span><span>' + dengi(p.fakt) + '</span></div>' +
      '<div class="para"><span class="tihiy">' + ekranirovat(t("obyazatelstva")) + '</span><span>' + dengi(p.obyazatelstva) + '</span></div>' +
      (p.zakazat_predstoit > 0 ? '<div class="para"><span class="tihiy">' + ekranirovat(t("predstoit_zakazat")) + '</span><span>' + dengi(p.zakazat_predstoit) + '</span></div>' : '') +
      '<div class="para"><span class="tihiy">' + ekranirovat(t("lyudey")) + '</span><span>' + chislo(p.lyudey) + '</span></div>' +
      '</div></article>';
  }).join("");

  const stroki = DANNYE.signaly.map(s => {
    return '<tr>' +
      '<td><span class="znachok ' + s.uroven + '">' + ekranirovat(nz(DANNYE.ploshchadki.find(p => p.id === s.ploshchadka), "kod")) + '</span></td>' +
      '<td>' + ekranirovat(nz(s)) + '</td>' +
      '<td>' + ekranirovat(nz(s, "otvetstvennyy")) + '</td>' +
      '<td class="ch">' + data(s.srok) + '</td>' +
      '<td class="ch"><button type="button" class="knopka" onclick="pereyti(\'' + s.ssylka + '\')">' +
      ekranirovat(t("pereyti")) + ' ' + s.ssylka + '</button></td></tr>';
  });

  const itogo_akt = DANNYE.raboty.reduce((s, r) => s + r.summa_akt, 0);
  const itogo_zatrat = DANNYE.raboty.reduce((s, r) => s + r.summa_zatrat, 0);
  const itogo_poteryano = DANNYE.raboty.reduce((s, r) => s + Math.max(0, r.poteryano), 0);
  const itogo_rashozhdeniy = DANNYE.raboty.reduce((s, r) => s + Math.max(0, -r.poteryano), 0);

  ekran("svodka").innerHTML =
    zagolovok_ekrana(t("vkladka_svodka")) +
    '<div class="karty">' + karty + '</div>' +
    '<div class="dvoyka"><div class="blok"><h3>' + ekranirovat(t("vsego_po_chetyrem")) + '</h3>' +
    '<div class="pary">' +
    '<div class="para"><span class="tihiy">' + ekranirovat(t("summa_akt")) + '</span><span>' + dengi(itogo_akt) + '</span></div>' +
    '<div class="para"><span class="tihiy">' + ekranirovat(t("summa_zatrat")) + '</span><span>' + dengi(itogo_zatrat) + '</span></div>' +
    '<div class="para"><span class="tihiy">' + ekranirovat(t("marzha_sobrana")) + '</span><span>' + dengi(itogo_akt - itogo_zatrat) + '</span></div>' +
    '<div class="para"><span class="tihiy">' + ekranirovat(t("poteryano_vsego")) + '</span><span class="krasnoe">' + dengi(itogo_poteryano) + '</span></div>' +
    '<div class="para"><span class="tihiy">' + ekranirovat(t("rashozhdeniya")) + '</span><span class="zheltoe">' + dengi(itogo_rashozhdeniy) + '</span></div>' +
    '</div></div>' +
    '<div class="blok"><h3>' + ekranirovat(t("demo")) + '</h3><p class="snoska">' + ekranirovat(t("demo_poyasnenie")) + '</p></div></div>' +
    '<h3>' + ekranirovat(t("zhdet_resheniya")) + '</h3>' +
    tablica([{tekst: t("ploshchadka")}, {tekst: t("signal")}, {tekst: t("otvetstvennyy")},
             {tekst: t("srok"), ch: true}, {tekst: "", ch: true}], stroki);
}

/* --- экран 2: склад --- */
function narisovat_sklad() {
  const knopki = DANNYE.ploshchadki.map(p =>
    '<button type="button" class="knopka" aria-pressed="' + (SKLAD === p.id) + '" onclick="vybrat_sklad(\'' + p.id + '\')">' +
    ekranirovat(nz(p, "kod")) + '</button>').join("");

  const ostatki = DANNYE.ostatki.filter(o => o.ploshchadka === SKLAD).map(o =>
    '<tr><td>' + ekranirovat(nz(o)) + '</td><td class="ch">' + chislo(o.kol, 1) + '</td>' +
    '<td>' + ekranirovat(nz(o, "ed")) + '</td><td class="ch">' + dengi(o.stoimost) + '</td></tr>');

  const dvizheniya = DANNYE.sklad_dvizheniya
    .filter(d => d.ploshchadka === SKLAD || d.kuda === SKLAD)
    .sort((a, b) => a.data < b.data ? 1 : -1)
    .map(d => {
      const tip = d.tip === "prihod" ? t("prihod") : (d.tip === "vydacha" ? t("vydacha") : t("peremeshchenie"));
      const cvet = d.tip === "prihod" ? "zelenyy" : (d.tip === "vydacha" ? "seryy" : "zheltyy");
      const dokument = d.bez_dokumenta
        ? '<span class="znachok zheltyy">' + ekranirovat(t("bez_dokumenta")) + '</span>'
        : ekranirovat(d.dokument);
      const kuda = d.kuda ? " → " + ekranirovat(d.kuda) : "";
      return '<tr' + (d.bez_dokumenta ? ' class="podsvechena"' : '') + '>' +
        '<td class="ch">' + data(d.data) + '</td>' +
        '<td><span class="znachok ' + cvet + '">' + ekranirovat(tip) + kuda + '</span></td>' +
        '<td>' + ekranirovat(nz(d)) + '</td>' +
        '<td class="ch">' + chislo(d.kol, 1) + ' ' + ekranirovat(nz(d, "ed")) + '</td>' +
        '<td>' + (d.rabota ? ekranirovat(d.rabota) : "—") + '</td>' +
        '<td>' + ekranirovat(nz(d, "kto")) + '</td>' +
        '<td>' + dokument + '</td></tr>';
    });

  ekran("sklad").innerHTML =
    zagolovok_ekrana(t("vkladka_sklad"), knopki) +
    '<div class="dvoyka">' +
    '<div><h3>' + ekranirovat(t("sklad_ostatki")) + '</h3>' +
    tablica([{tekst: t("resurs")}, {tekst: t("kolichestvo"), ch: true}, {tekst: ""},
             {tekst: t("stoimost"), ch: true}], ostatki) + '</div>' +
    '<div class="blok"><h3>' + ekranirovat(t("marzha_sobrana")) + '</h3>' +
    '<p class="snoska">' + ekranirovat(t("odna_stroka_mnogo_resursov")) + '</p></div></div>' +
    '<h3>' + ekranirovat(t("sklad_dvizheniya")) + '</h3>' +
    tablica([{tekst: t("data"), ch: true}, {tekst: t("tip_dvizheniya")}, {tekst: t("resurs")},
             {tekst: t("kolichestvo"), ch: true}, {tekst: t("rabota")}, {tekst: t("kto")},
             {tekst: t("dokument")}], dvizheniya);
}
function vybrat_sklad(id) { SKLAD = id; narisovat(); }

/* --- экран 3: акт и затраты --- */
function narisovat_akt() {
  const stroki = [];
  DANNYE.raboty.forEach(r => {
    const otkryta = RASKRYTO.has(r.id);
    stroki.push('<tr class="klikabelnaya' + (PODSVETKA === r.id ? ' podsvechena' : '') + '" tabindex="0"' +
      ' onclick="perevernut(\'' + r.id + '\')" onkeydown="if(event.key===\'Enter\'){perevernut(\'' + r.id + '\')}">' +
      '<td class="kod">' + (otkryta ? "▾ " : "▸ ") + ekranirovat(r.id) + '</td>' +
      '<td>' + ekranirovat(nz(r)) + '</td>' +
      '<td class="ch">' + chislo(r.obem_fakt, 1) + ' ' + ekranirovat(nz(r, "ed")) + '</td>' +
      '<td class="ch">' + dengi(r.cena_akt, 2) + '</td>' +
      '<td class="ch">' + dengi(r.summa_akt) + '</td>' +
      '<td class="ch">' + dengi(r.summa_zatrat) + '</td>' +
      '<td class="ch">' + dengi(r.marzha) + ' <span class="tihiy">(' + chislo(r.marzha_pct, 1) + ' %)</span></td>' +
      '<td class="ch">' + (r.poteryano > 0
        ? '<span class="krasnoe">−' + dengi(r.poteryano) + '</span>'
        : (r.poteryano < 0 ? '<span class="zheltoe">± ' + dengi(-r.poteryano) + '</span>' : '—')) + '</td></tr>');

    if (!otkryta) return;
    const vnutri = r.resursy.map(x =>
      '<tr><td>' + ekranirovat(nz(x)) + ' <span class="tihiy melko">(' +
      ekranirovat(x.skladskoy ? t("iz_sklada") : t("iz_tabelya")) + ')</span></td>' +
      '<td class="ch">' + chislo(x.norma, 3) + '</td>' +
      '<td class="ch">' + chislo(x.teoreticheskiy, 1) + ' ' + ekranirovat(nz(x, "ed")) + '</td>' +
      '<td class="ch">' + chislo(x.vydano, 1) + ' ' + ekranirovat(nz(x, "ed")) + '</td>' +
      '<td class="ch">' + (x.otklonenie > 0 ? '<span class="krasnoe">+' + chislo(x.otklonenie, 1) + '</span>'
        : (x.otklonenie < 0 ? '<span class="zelenoe">' + chislo(x.otklonenie, 1) + '</span>' : "0")) + '</td>' +
      '<td class="ch">' + dengi(x.summa_fakt) + '</td>' +
      '<td class="ch">' + (x.summa_otkloneniya > 0 ? '<span class="krasnoe">−' + dengi(x.summa_otkloneniya) + '</span>'
        : (x.summa_otkloneniya < 0 ? '<span class="zelenoe">+' + dengi(-x.summa_otkloneniya) + '</span>' : "—")) + '</td></tr>').join("");

    stroki.push('<tr class="raskrytie"><td colspan="8"><div class="vnutri">' +
      '<p class="melko tihiy">' + ekranirovat(t("odna_stroka_mnogo_resursov")) + '</p>' +
      '<table><thead><tr><th>' + ekranirovat(t("resurs")) + '</th><th class="ch">' + ekranirovat(t("norma")) + '</th>' +
      '<th class="ch">' + ekranirovat(t("teoreticheskiy")) + '</th><th class="ch">' + ekranirovat(t("vydano_fakt")) + '</th>' +
      '<th class="ch">' + ekranirovat(t("otklonenie")) + '</th><th class="ch">' + ekranirovat(t("summa_zatrat")) + '</th>' +
      '<th class="ch">' + ekranirovat(t("cena_otkloneniya")) + '</th></tr></thead><tbody>' + vnutri + '</tbody></table>' +
      '<div class="pary"><div class="para"><span class="tihiy">' + ekranirovat(t("marzha_po_norme")) + '</span>' +
      '<span>' + dengi(r.marzha_po_norme) + '</span></div>' +
      '<div class="para"><span class="tihiy">' + ekranirovat(t("marzha")) + '</span><span>' + dengi(r.marzha) + '</span></div></div>' +
      '</div></td></tr>');
  });

  ekran("akt").innerHTML =
    zagolovok_ekrana(t("akt_stroki")) +
    '<p class="snoska">' + ekranirovat(t("akt_podskazka")) + '</p>' +
    '<p class="snoska">' + ekranirovat(t("kod_zatrat")) + '</p>' +
    tablica([{tekst: t("rabota")}, {tekst: ""}, {tekst: t("obem"), ch: true}, {tekst: t("cena_akt"), ch: true},
             {tekst: t("summa_akt"), ch: true}, {tekst: t("summa_zatrat"), ch: true},
             {tekst: t("marzha"), ch: true}, {tekst: t("otklonenie"), ch: true}], stroki);
}
function perevernut(id) {
  if (RASKRYTO.has(id)) RASKRYTO.delete(id); else RASKRYTO.add(id);
  narisovat();
}

/* --- экран 4: план закупок --- */
function narisovat_zakupki() {
  const knopki = ['<button type="button" class="knopka" aria-pressed="' + (ZAKUPKI === "*") +
    '" onclick="vybrat_zakupki(\'*\')">' + ekranirovat(t("vse_ploshchadki")) + '</button>'].concat(
    DANNYE.ploshchadki.map(p => '<button type="button" class="knopka" aria-pressed="' + (ZAKUPKI === p.id) +
      '" onclick="vybrat_zakupki(\'' + p.id + '\')">' + ekranirovat(nz(p, "kod")) + '</button>')).join("");

  const spisok = DANNYE.zakazy.filter(z => ZAKUPKI === "*" || z.ploshchadka === ZAKUPKI);
  const vse_daty = DANNYE.zakazy.flatMap(z => [z.data_zakaza, z.data_potrebnosti, z.razmeshchen, z.postavka_ozhidaetsya])
    .filter(Boolean).map(s => new Date(s).getTime());
  const nachalo = Math.min.apply(null, vse_daty), konec = Math.max.apply(null, vse_daty);
  const dolya = (s) => 100 * (new Date(s).getTime() - nachalo) / (konec - nachalo);

  const karty = spisok.map(z => {
    const sostoyanie = z.prosrochen ? "krasny" : (z.srochnyy ? "zheltyy" : "zelenyy");
    const podpis = z.prosrochen
      ? t("prosrochen") + (z.opozdanie_nedel ? " · " + z.opozdanie_nedel + " " + t("nedel") + " " + t("opozdanie") : "")
      : (z.srochnyy ? t("srochnyy") + " · " + z.dney_do_zakaza + " " + t("dney_ostalos") : t("v_grafike"));
    const ot = Math.min(dolya(z.data_zakaza), dolya(z.data_potrebnosti));
    const shirina = Math.max(2, Math.abs(dolya(z.data_potrebnosti) - dolya(z.data_zakaza)));
    return '<article class="zakaz' + (PODSVETKA === z.id ? ' podsvechena' : '') + '">' +
      '<div class="zakaz-verh"><div><strong>' + ekranirovat(nz(z)) + '</strong> ' +
      '<span class="tihiy melko">' + chislo(z.kol) + ' ' + ekranirovat(nz(z, "ed")) + ' · ' + ekranirovat(z.id) + '</span></div>' +
      '<div class="knopki"><span class="znachok ' + sostoyanie + '">' + ekranirovat(podpis) + '</span>' +
      '<span class="znachok seryy">' + dengi(z.summa) + '</span></div></div>' +
      '<div class="shkala"><i style="left:' + ot + '%;width:' + shirina + '%"></i>' +
      '<span class="metka ' + sostoyanie + '" style="left:' + dolya(z.data_zakaza) + '%"></span>' +
      '<span class="metka" style="left:' + dolya(z.data_potrebnosti) + '%"></span></div>' +
      '<div class="shkala-podpisi"><span>' + ekranirovat(t("data_zakaza")) + ': <strong>' + data(z.data_zakaza) + '</strong>' +
      ' · ' + ekranirovat(t("srok_postavki")) + ' ' + z.srok_nedel + ' ' + ekranirovat(t("nedel")) + '</span>' +
      '<span>' + ekranirovat(t("data_potrebnosti")) + ': <strong>' + data(z.data_potrebnosti) + '</strong></span></div>' +
      '<div class="shkala-podpisi"><span>' + (z.razmeshchen
        ? ekranirovat(t("razmeshchen")) + ": " + data(z.razmeshchen) + " · " + ekranirovat(t("postavka_ozhidaetsya")) + ": " + data(z.postavka_ozhidaetsya)
        : ekranirovat(t("ne_razmeshchen"))) + '</span></div>' +
      cepochka_soglasovaniya(z) +
      '</article>';
  }).join("");

  ekran("zakupki").innerHTML =
    zagolovok_ekrana(t("zakupki_zagolovok"), knopki) +
    '<p class="snoska">' + ekranirovat(t("zakupki_pravilo")) + '</p>' +
    '<div class="lenta">' + karty + '</div>';
}
function vybrat_zakupki(id) { ZAKUPKI = id; narisovat(); }

function cepochka_soglasovaniya(z) {
  const sostoyanie = z.onay.status === "zhdet" ? "krasny"
    : (z.onay.status === "utverzhden" ? "zelenyy" : "seryy");
  const podpis = z.onay.status === "zhdet" ? t("onay_zhdet")
    : (z.onay.status === "utverzhden" ? t("onay_utverzhden") : t("onay_ne_trebuetsya"));
  const dni = z.trebuet_onaya
    ? ' <span class="' + (z.dney_na_onay > 14 ? "krasnoe" : "tihiy") + '">' +
      z.dney_na_onay + " " + ekranirovat(t("dney_na_onay")) + "</span>"
    : "";
  return '<div class="zvenya">' +
    '<span class="zveno"><b>' + ekranirovat(t("zayavka")) + '</b> ' + data(z.zayavka.data) +
    ' · ' + ekranirovat(nz(z.zayavka, "kto")) + '</span>' +
    '<span class="zveno"><b>' + ekranirovat(t("onay")) + '</b> ' +
    '<span class="znachok ' + sostoyanie + '">' + ekranirovat(podpis) + '</span>' + dni +
    (z.trebuet_onaya && nz(z.onay, "kto") ? ' · ' + ekranirovat(nz(z.onay, "kto")) : "") +
    (z.trebuet_onaya ? ' <span class="tihiy melko">(' + ekranirovat(t("polnomochie")) + ' ' + dengi(z.polnomochie) + ')</span>' : "") +
    '</span>' +
    '<span class="zveno"><b>' + ekranirovat(t("razmeshchen")) + '</b> ' +
    (z.razmeshchen ? data(z.razmeshchen) : "—") + '</span>' +
    '</div>';
}

/* --- экран: денежный поток --- */
function narisovat_dengi() {
  const p = DANNYE.denezhnyy_potok;
  const predel = Math.max.apply(null, p.nedeli.map(n => Math.max(n.postupleniya, n.vyplaty)));
  const stroki = p.nedeli.map(n => {
    const minus = n.nakoplennoe < 0;
    return '<tr>' +
      '<td class="kod">' + data(n.nachalo) + ' — ' + data(n.konec) + '</td>' +
      '<td class="ch">' + (n.postupleniya ? dengi(n.postupleniya) : "—") + '</td>' +
      '<td class="ch">' + dengi(n.vyplaty) + '</td>' +
      '<td><div class="stolbiki">' +
        '<i class="prihod" style="width:' + (100 * n.postupleniya / predel) + '%"></i>' +
        '<i class="rashod" style="width:' + (100 * n.vyplaty / predel) + '%"></i>' +
      '</div></td>' +
      '<td class="ch">' + (n.saldo < 0 ? '<span class="krasnoe">' + dengi(n.saldo) + '</span>' : '<span class="zelenoe">+' + dengi(n.saldo) + '</span>') + '</td>' +
      '<td class="ch">' + (minus ? '<span class="krasnoe">' + dengi(n.nakoplennoe) + '</span>' : dengi(n.nakoplennoe)) + '</td>' +
      '</tr>';
  });

  const platezhi = p.platezhi.filter(x => x.zakaz).sort((a, b) => b.summa - a.summa).slice(0, 6).map(x =>
    '<tr><td class="ch">' + data(x.data) + '</td><td>' + ekranirovat(nz(x)) + '</td>' +
    '<td class="kod">' + ekranirovat(x.zakaz) + '</td>' +
    '<td>' + ekranirovat(nz(x, "vid")) + '</td>' +
    '<td class="ch">' + dengi(x.summa) + '</td></tr>');

  const prihody = p.prihody.map(x =>
    '<tr><td class="ch">' + data(x.data) + '</td><td class="kod">' + ekranirovat(x.akt) + '</td>' +
    '<td>' + ekranirovat(nz(DANNYE.ploshchadki.find(pl => pl.id === x.ploshchadka), "kod")) + '</td>' +
    '<td class="ch">' + dengi(x.summa) + '</td></tr>');

  ekran("dengi").innerHTML =
    zagolovok_ekrana(t("vkladka_dengi")) +
    '<div class="karty">' +
    '<article class="karta"><div class="karta-imya">' + ekranirovat(t("ostatok_na_starte")) + '</div>' +
    '<div class="krupno">' + dengi(p.ostatok_na_starte) + '</div></article>' +
    '<article class="karta ' + (p.razryv < 0 ? "krasny" : "zelenyy") + '"><div class="karta-imya">' + ekranirovat(t("razryv")) + '</div>' +
    '<div class="krupno ' + (p.razryv < 0 ? "krasnoe" : "") + '">' + dengi(p.razryv) + '</div></article>' +
    '<article class="karta"><div class="karta-imya">' + ekranirovat(t("fot_v_nedelyu")) + '</div>' +
    '<div class="krupno">' + dengi(p.fot_v_nedelyu) + '</div></article>' +
    '</div>' +
    '<p class="snoska">' + ekranirovat(t("razryv_poyasnenie")) + '</p>' +
    tablica([{tekst: t("nedelya")}, {tekst: t("postupleniya"), ch: true}, {tekst: t("vyplaty"), ch: true},
             {tekst: ""}, {tekst: t("saldo"), ch: true}, {tekst: t("nakoplennoe"), ch: true}], stroki) +
    '<div class="dvoyka">' +
    '<div><h3>' + ekranirovat(t("krupnye_platezhi")) + '</h3>' +
    tablica([{tekst: t("data"), ch: true}, {tekst: t("resurs")}, {tekst: ""},
             {tekst: t("vid_platezha")}, {tekst: t("summa"), ch: true}], platezhi) + '</div>' +
    '<div><h3>' + ekranirovat(t("prihody_po_aktam")) + '</h3>' +
    tablica([{tekst: t("data"), ch: true}, {tekst: t("akt")}, {tekst: t("ploshchadka")},
             {tekst: t("summa"), ch: true}], prihody) + '</div>' +
    '</div>';
}

/* --- экран 5: тендер --- */

    (s.raznica_pct > 0 ? "+" : "") + chislo(s.raznica_pct, 1) + ' %</span></td>' +
    '<td class="ch">' + dengi(s.cena_oshibki) + '</td></tr>');

  ekran("tender").innerHTML =
    zagolovok_ekrana(t("tender_reestr")) +
    tablica([{tekst: ""}, {tekst: t("obekt")}, {tekst: t("srok_podachi"), ch: true},
             {tekst: t("summa"), ch: true}, {tekst: t("status")}], stroki) +
    '<h3>' + ekranirovat(t("razbor_paketa")) + ' · ' + ekranirovat(r.tender) + '</h3>' +
    '<div class="dvoyka">' +
    '<div class="blok"><h3>' + ekranirovat(t("trebovaniya")) + '</h3>' + spisok(r.trebovaniya, "") + '</div>' +
    '<div class="blok"><h3>' + ekranirovat(t("riski")) + '</h3>' + spisok(r.riski, "riski") + '</div>' +
    '<div class="blok"><h3>' + ekranirovat(t("nehvatka")) + '</h3>' + spisok(r.nehvatka, "nehvatka") + '</div>' +
    '</div>' +
    '<h3>' + ekranirovat(t("sravnenie_zagolovok")) + '</h3>' +
    tablica([{tekst: t("resurs")}, {tekst: t("v_tendere"), ch: true}, {tekst: t("norma"), ch: true},
             {tekst: t("fakt_na_edinicu"), ch: true}, {tekst: t("raznica"), ch: true},
             {tekst: t("cena_oshibki"), ch: true}], sravnenie) +
    '<p class="snoska">' + ekranirovat(t("vyvod_tendera")) + '</p>';
}

/* --- экран 6: персонал --- */
function narisovat_personal() {
  const stroki = DANNYE.tabel.map(x => {
    const p = DANNYE.ploshchadki.find(p => p.id === x.ploshchadka);
    const mnogo = x.dolya_pererabotok_pct >= 15;
    const mnogo_sub = x.dolya_subpodryada_pct >= 50;
    return '<tr><td>' + ekranirovat(nz(p, "kod")) + ' <span class="tihiy melko">' + ekranirovat(nz(p, "tip")) + '</span></td>' +
      '<td class="ch">' + chislo(x.lyudey) + '</td>' +
      '<td class="ch">' + chislo(x.subpodryad_lyudey) + '</td>' +
      '<td class="ch">' + (mnogo_sub ? '<span class="krasnoe">' + chislo(x.dolya_subpodryada_pct, 1) + ' %</span>'
                                     : chislo(x.dolya_subpodryada_pct, 1) + ' %') + '</td>' +
      '<td class="ch">' + chislo(x.vsego_chasov) + '</td>' +
      '<td class="ch">' + chislo(x.pererabotki) + '</td>' +
      '<td class="ch">' + (mnogo ? '<span class="krasnoe">' + chislo(x.dolya_pererabotok_pct, 1) + ' %</span>'
                                 : chislo(x.dolya_pererabotok_pct, 1) + ' %') + '</td>' +
      '<td class="ch">' + dengi(x.stoimost_vsego) + '</td>' +
      '<td class="ch">' + dengi(x.stoimost_pererabotok) + '</td>' +
      '<td>' + ekranirovat(nz(x, "kvalifikaciya")) + '<br><span class="tihiy melko">' + ekranirovat(nz(x, "subpodryad")) + '</span></td></tr>';
  });

  const trud = [];
  DANNYE.raboty.forEach(r => {
    r.resursy.filter(x => x.resurs === "trud").forEach(x => {
      trud.push('<tr><td>' + ekranirovat(r.id) + '</td><td>' + ekranirovat(nz(r)) + '</td>' +
        '<td class="ch">' + chislo(x.teoreticheskiy) + '</td>' +
        '<td class="ch">' + chislo(x.vydano) + '</td>' +
        '<td class="ch">' + (x.otklonenie > 0 ? '<span class="krasnoe">+' + chislo(x.otklonenie) + '</span>' : chislo(x.otklonenie)) + '</td>' +
        '<td class="ch">' + dengi(x.summa_fakt) + '</td></tr>');
    });
  });

  ekran("personal").innerHTML =
    zagolovok_ekrana(t("personal_zagolovok")) +
    tablica([{tekst: t("ploshchadka")}, {tekst: t("svoi"), ch: true}, {tekst: t("subpodryad"), ch: true},
             {tekst: t("dolya_subpodryada"), ch: true}, {tekst: t("chasov"), ch: true},
             {tekst: t("pererabotki"), ch: true}, {tekst: t("dolya_pererabotok"), ch: true},
             {tekst: t("stoimost_vsego"), ch: true}, {tekst: t("stoimost_pererabotok"), ch: true},
             {tekst: t("kvalifikaciya")}], stroki) +
    '<h3>' + ekranirovat(t("trud_po_rabotam")) + '</h3>' +
    tablica([{tekst: t("rabota")}, {tekst: ""}, {tekst: t("teoreticheskiy"), ch: true},
             {tekst: t("vydano_fakt"), ch: true}, {tekst: t("otklonenie"), ch: true},
             {tekst: t("stoimost_truda"), ch: true}], trud);
}

/* --- экран 7: помощник --- */
function narisovat_ii() {
  const knopki = DANNYE.voprosy_ii.map(v =>

function vybrat_vopros(id) { VOPROS = id; narisovat(); }

/* --- экран: презентация --- */
function slayd_telo(s) {
  const obertka = (elementy, klass) => '<div class="' + klass + '">' + elementy + '</div>';
  if (s.tip === "oblozhka") {
    const metki = nz(s, "metki").map(m => '<span class="znachok seryy">' + ekranirovat(m) + '</span>').join("");
    return '<div class="slayd-oblozhka">' +
      '<div class="eyebrow">' + ekranirovat(nz(s, "nadzagolovok")) + '</div>' +
      '<h2 class="slayd-titul">' + ekranirovat(nz(s, "zagolovok")) + '</h2>' +
      '<p class="slayd-lid">' + ekranirovat(nz(s, "podzagolovok")) + '</p>' +
      '<div class="knopki">' + metki + '</div></div>';
  }
  if (s.tip === "punkty" || s.tip === "roli") {
    const el = (s.punkty || s.roli).map((x, i) =>
      '<article class="slayd-karta"><span class="slayd-nomer">' + String(i + 1).padStart(2, "0") + '</span>' +
      '<h4>' + ekranirovat(nz(x)) + '</h4>' +
      '<p class="tihiy">' + ekranirovat(nz(x, "text")) + '</p></article>').join("");
    return obertka(el, "slayd-setka");
  }
  if (s.tip === "sloi") {
    const el = s.sloi.map(x =>
      '<article class="slayd-sloy"><span class="sloy-nomer">' + ekranirovat(x.nomer) + '</span>' +
      '<div><h4>' + ekranirovat(nz(x)) + '</h4>' +
      '<p class="tihiy">' + ekranirovat(nz(x, "text")) + '</p></div></article>').join("");
    return obertka(el, "slayd-sloi");
  }
  if (s.tip === "cepochka") {
    const el = s.zvenya.map((x, i) =>
      '<article class="slayd-zveno"><span class="zveno-nomer">' + (i + 1) + '</span>' +
      '<h4>' + ekranirovat(nz(x)) + '</h4>' +
      '<p class="tihiy melko">' + ekranirovat(nz(x, "text")) + '</p></article>').join("");
    return obertka(el, "slayd-cepochka");
  }
  if (s.tip === "razlozhenie") {
    const resursy = s.resursy.map(x =>
      '<div class="resurs-stroka"><span>' + ekranirovat(nz(x)) + '</span>' +
      '<span class="tihiy">' + ekranirovat(nz(x, "ed")) + '</span></div>').join("");
    return '<div class="slayd-razlozhenie">' +
      '<article class="storona levo"><div class="eyebrow">' + ekranirovat(nz(s, "levo_zagolovok")) + '</div>' +
      '<div class="poz">' + ekranirovat(nz(s, "levo_poz")) + '</div>' +
      '<div class="tihiy">' + ekranirovat(nz(s, "levo_kol")) + '</div></article>' +
      '<div class="strelka" aria-hidden="true">&#8594;</div>' +
      '<article class="storona pravo"><div class="eyebrow">' + ekranirovat(nz(s, "pravo_zagolovok")) + '</div>' +
      resursy + '</article></div>';
  }
  if (s.tip === "zony") {
    const el = s.zony.map((x, i) =>
      '<article class="slayd-zona"><span class="zona-nomer">' + String(i + 1).padStart(2, "0") + '</span>' +
      ekranirovat(nz(x)) + '</article>').join("");
    return obertka(el, "slayd-zony");
  }
  if (s.tip === "etapy") {
    const el = s.etapy.map(x =>
      '<article class="slayd-etap"><div class="eyebrow">' + ekranirovat(nz(x, "srok")) + '</div>' +
      '<h4>' + ekranirovat(nz(x)) + '</h4>' +
      '<p class="tihiy">' + ekranirovat(nz(x, "text")) + '</p></article>').join("");
    return obertka(el, "slayd-etapy");
  }
  if (s.tip === "resheniya") {
    const el = s.punkty.map((x, i) =>
      '<article class="slayd-reshenie"><span class="slayd-nomer">' + String(i + 1).padStart(2, "0") + '</span>' +
      ekranirovat(nz(x)) + '</article>').join("");
    return obertka(el, "slayd-resheniya");
  }
  return "";
}

function odin_slayd(s, vidim) {
  return '<section class="slayd" data-id="' + s.id + '"' + (vidim ? "" : " hidden") + '>' +
    (s.tip === "oblozhka" ? "" :
      '<header class="slayd-shapka"><span class="eyebrow">AVENSOL</span>' +
      '<h3>' + ekranirovat(nz(s, "zagolovok")) + '</h3>' +
      '<span class="slayd-schet">' + ekranirovat(s.nomer || "") + '</span></header>') +
    slayd_telo(s) +
    (s.snoska_tr ? '<p class="slayd-snoska">' + ekranirovat(nz(s, "snoska")) + '</p>' : "") +
    '</section>';
}

function narisovat_sunum() {
  const vsego = SLAYDY.length;
  const tochki = SLAYDY.map((s, i) =>
    '<button type="button" class="tochka' + (i === SLAYD ? " tekushchaya" : "") + '"' +
    ' aria-label="' + ekranirovat(t("slayd")) + ' ' + (i + 1) + '" onclick="pokazat_slayd(' + i + ')"></button>').join("");
  const slaydy = SLAYDY.map((s, i) => odin_slayd(s, SLAYDY_PODRYAD || i === SLAYD)).join("");
  ekran("sunum").innerHTML =
    '<div class="zagolovok-ekrana"><h2>' + ekranirovat(t("prezentaciya_kartochka")) + '</h2>' +
    '<div class="knopki">' +
    '<button type="button" class="knopka" onclick="listat(-1)">&#8592; ' + ekranirovat(t("nazad")) + '</button>' +
    '<span class="znachok seryy">' + (SLAYD + 1) + ' / ' + vsego + '</span>' +
    '<button type="button" class="knopka" onclick="listat(1)">' + ekranirovat(t("dalshe")) + ' &#8594;</button>' +
    '<button type="button" class="knopka" aria-pressed="' + SLAYDY_PODRYAD + '" onclick="vse_slaydy()">' +
    ekranirovat(SLAYDY_PODRYAD ? t("po_odnomu") : t("vse_slaydy")) + '</button>' +
    '<button type="button" class="knopka" onclick="pechat_sunum()">' + ekranirovat(t("skachat_pdf")) + '</button>' +
    plashka_demo() + '</div></div>' +
    (SLAYDY_PODRYAD ? "" : '<div class="tochki">' + tochki + '</div>') +
    '<div class="slaydy">' + slaydy + '</div>';
}
function pokazat_slayd(i) { SLAYD = i; SLAYDY_PODRYAD = false; zapisat_adres(); narisovat(); }
function listat(shag) { SLAYD = (SLAYD + shag + SLAYDY.length) % SLAYDY.length; zapisat_adres(); narisovat(); }
function vse_slaydy() { SLAYDY_PODRYAD = !SLAYDY_PODRYAD; narisovat(); }
function pechat_sunum() {
  VKLADKA = "sunum"; SLAYDY_PODRYAD = true; narisovat();
  setTimeout(() => window.print(), 120);
}

/* --- общая отрисовка --- */
function narisovat() {
  document.documentElement.lang = YAZYK;
  document.getElementById("zagolovok").textContent = t("zagolovok");
  document.getElementById("podzagolovok").textContent = t("podzagolovok");
  document.getElementById("plashka").textContent = t("demo");
  document.getElementById("yaz-tr").setAttribute("aria-pressed", YAZYK === "tr");
  document.getElementById("yaz-ru").setAttribute("aria-pressed", YAZYK === "ru");
  document.title = t("zagolovok");

  document.getElementById("vkladki").innerHTML = EKRANY.map(e =>
    '<button type="button" role="tab" aria-selected="' + (VKLADKA === e.kod) + '" onclick="vybrat_vkladku(\'' + e.kod + '\')">' +
    ekranirovat(t(e.klyuch)) + '</button>').join("");

  narisovat_otdely(); narisovat_sunum(); narisovat_svodku(); narisovat_sklad(); narisovat_akt(); narisovat_zakupki();
  narisovat_dengi(); narisovat_tender(); narisovat_personal(); narisovat_ii();
  EKRANY.forEach(e => { ekran(e.kod).hidden = (e.kod !== VKLADKA); });

  document.getElementById("podval").textContent =
    t("demo") + " · " + t("demo_poyasnenie") + " · " + data(DANNYE.meta.data);
}
function vybrat_vkladku(kod) { VKLADKA = kod; PODSVETKA = null; zapisat_adres(); narisovat(); }

// Экран виден в адресе: ссылку можно отправить на конкретную вкладку.
function zapisat_adres() {
  const novyy = "#" + VKLADKA + (VKLADKA === "sunum" ? "/" + (SLAYD + 1) : "");
  // При открытии с флешки или из архива запись адреса может быть запрещена —
  // это не повод ронять страницу.
  try {
    if (location.hash !== novyy) history.replaceState(null, "", novyy);
  } catch (e) { /* адрес просто не меняется */ }
}
function prochitat_adres() {
  const chasti = (location.hash || "").replace("#", "").split("/");
  if (EKRANY.some(e => e.kod === chasti[0])) VKLADKA = chasti[0];
  const nomer = parseInt(chasti[1], 10);
  if (!isNaN(nomer) && nomer >= 1 && nomer <= SLAYDY.length) SLAYD = nomer - 1;
}
function smenit_yazyk(kod) { YAZYK = kod; narisovat(); }

document.addEventListener("keydown", (e) => {
  if (VKLADKA !== "sunum" || SLAYDY_PODRYAD) return;
  if (e.key === "ArrowRight") listat(1);
  if (e.key === "ArrowLeft") listat(-1);
});
document.getElementById("yaz-tr").addEventListener("click", () => smenit_yazyk("tr"));
document.getElementById("yaz-ru").addEventListener("click", () => smenit_yazyk("ru"));
prochitat_adres();
narisovat();
window.addEventListener("hashchange", () => { prochitat_adres(); narisovat(); });
</script>
</body>
</html>
